[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cytos"
version = "0.0.1"
description = "Fast, read-only viewer for spatial biology: cell segmentation polygons over a large OME-Zarr morphology image."
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pygfx",
    "wgpu",
    "rendercanvas",
    "PySide6",
    "ome-zarr",
    "zarr",
    "tifffile",
    "dask[array]",
    "plotlet>=0.6.4",
    "pyarrow",
    "mapbox_earcut",
    # Label-mask segmentation import (cytos.prep.labels): marching-squares
    # contours and Douglas-Peucker simplification from scikit-image, per-object
    # bounding boxes from scipy. Both already arrive with ome-zarr, but this is
    # the first code here that imports them directly.
    "scikit-image",
    "scipy",
]

[project.optional-dependencies]
# `cytos-mcp`, the MCP adapter for AI clients without a shell — optional
# because the MCP SDK drags in a web stack the viewer itself never needs.
mcp = ["mcp>=2"]

[project.scripts]
cytos-viewer = "cytos.cli:viewer"
cytos-ctl = "cytos.cli:ctl"
cytos-mcp = "cytos.cli:mcp_server"
cytos-import = "cytos.cli:import_slide"
cytos-convert-ome-zarr = "cytos.cli:convert_ome_zarr"

[tool.hatch.build.targets.wheel]
packages = ["src/cytos"]
