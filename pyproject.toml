[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cytos"
version = "0.1.0"
description = "Build `.cytos` slides for spatial biology: cell segmentation polygons tiled over a large OME-Zarr morphology image."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "gitbamboo42" },
]
keywords = [
    "spatial-biology",
    "microscopy",
    "segmentation",
    "ome-zarr",
    "xenium",
    "visualization",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy",
    "ome-zarr",
    "zarr",
    "tifffile",
    "dask[array]",
    "pyarrow",
    "mapbox_earcut",
    # Label-mask segmentation import (cytos.prep.labels): marching-squares
    # contours and Douglas-Peucker simplification from scikit-image, per-object
    # bounding boxes from scipy. Both already arrive with ome-zarr, but this is
    # the first code here that imports them directly.
    "scikit-image",
    "scipy",
    # XOA 2.0 morphology images are JPEG-2000-compressed OME-TIFF; tifffile
    # needs imagecodecs to decode them (cytos.prep.pyramid).
    "imagecodecs",
]

[project.urls]
Homepage = "https://github.com/gitbamboo42/cytos"
Repository = "https://github.com/gitbamboo42/cytos"

[project.scripts]
cytos-import = "cytos.cli:import_slide"
cytos-convert-ome-zarr = "cytos.cli:convert_ome_zarr"

[tool.hatch.build.targets.wheel]
packages = ["src/cytos"]
